<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <DIV class="calculator">
        <INPUT type="tel" placeholder="0">
        <DIV>
            <button class="op">AC</button>
            <button class="op">Del</button>
            <button class="op">%</button>
            <button class="op">/</button>
        </DIV>
        <DIV>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="op">*</button>
        </DIV>
        <DIV>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="op">-</button>
        </DIV>
        <DIV>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="op">+</button>
        </DIV>
        <DIV>
            <button>00</button>
            <button>0</button>
            <button class="op">.</button>
            <button class="esiculto">=</button>
        </DIV>
    </DIV>
</body>
</html>
